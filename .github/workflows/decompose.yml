name: Decompose PRD (trigger)
# claude-code-action does not support the `push` event, so this thin workflow only finds the
# newly merged PRD and its source issue, then dispatches decompose-run.yml, which runs the agent.
on:
  push:
    branches: [main]
    paths: ["docs/prds/**"]

permissions: {}

jobs:
  dispatch:
    if: vars.FACTORY_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find the new PRD and its source issue, then dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          added=$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'docs/prds/*.md')
          if [[ -z "$added" || $(wc -l <<< "$added") -ne 1 ]]; then
            echo "Expected exactly one new PRD, got: '$added'. Nothing to decompose."; exit 0
          fi
          # The PRD PR body carries "Source-Issue: #N", written by the workflow (not the agent).
          body=$(gh api "repos/${REPO}/commits/${AFTER}/pulls" --jq '.[0].body // ""')
          src=$(grep -oE 'Source-Issue: #[0-9]+' <<< "$body" | grep -oE '[0-9]+' | head -1 || true)
          gh workflow run decompose-run.yml --repo "$REPO" --ref main -f prd="$added" -f source_issue="$src"
          echo "Dispatched decompose-run for $added (source issue: ${src:-none})"
